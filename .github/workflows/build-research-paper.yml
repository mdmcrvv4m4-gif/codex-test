name: Build research paper Word

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk
          pip install python-docx matplotlib
      - name: Generate native-equation Word document
        run: python tools/generate_native_equation_paper.py
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: native-equation-word
          path: |
            artifacts/95式电磁激光仿真训练模型结构与原理说明_无乱码_原生公式版.docx
            artifacts/95式电磁激光仿真训练模型_原生公式验证报告.txt
          if-no-files-found: error
      - name: Commit generated Word document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'artifacts/95式电磁激光仿真训练模型结构与原理说明_无乱码_原生公式版.docx' 'artifacts/95式电磁激光仿真训练模型_原生公式验证报告.txt'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish native equation Word document'
            git push
          fi
