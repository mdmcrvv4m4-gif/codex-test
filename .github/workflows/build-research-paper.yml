name: Build research paper Word

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install python-docx matplotlib
      - name: Generate corrected Word document
        run: python tools/generate_corrected_formula_paper.py
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: corrected-formula-word
          path: artifacts/95式电磁激光仿真训练模型结构与原理说明_公式内容完善版.docx
          if-no-files-found: error
      - name: Commit generated Word document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'artifacts/95式电磁激光仿真训练模型结构与原理说明_公式内容完善版.docx'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish corrected formula Word document'
            git push
          fi
