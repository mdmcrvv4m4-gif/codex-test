name: Build research paper Word

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk
          pip install python-docx matplotlib
      - name: Generate book-ready Word chapter
        run: python tools/generate_defense_education_book_chapter.py
      - name: Upload Word document
        uses: actions/upload-artifact@v4
        with:
          name: defense-education-book-chapter
          path: |
            artifacts/国防教育概论_95式外形仿真训练模型机电光系统原理_书稿版.docx
            artifacts/国防教育概论_95式案例_生成验证报告.txt
          if-no-files-found: error
      - name: Commit generated Word document
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'artifacts/国防教育概论_95式外形仿真训练模型机电光系统原理_书稿版.docx' 'artifacts/国防教育概论_95式案例_生成验证报告.txt'
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Publish defense education book chapter'
            git push
          fi
