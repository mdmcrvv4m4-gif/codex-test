name: build-docx
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install python-docx matplotlib
      - name: Generate base document
        run: python tools/generate_95_author_voice_seq_fixed.py
      - name: Add research-student photo descriptions
        run: python tools/postprocess_95_photo_descriptions.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 95-author-voice-photo-enhanced-docx
          path: artifacts/*
      - name: Publish enhanced DOCX to generated-output branch
        run: |
          DOCX='artifacts/95式电磁激光仿真训练模型结构与原理说明_研究生作者版_实物图说明增强版.docx'
          cp "$DOCX" /tmp/generated.docx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B generated-output
          cp /tmp/generated.docx '95式电磁激光仿真训练模型结构与原理说明_研究生作者版_实物图说明增强版.docx'
          git add '95式电磁激光仿真训练模型结构与原理说明_研究生作者版_实物图说明增强版.docx'
          git commit -m 'Update enhanced research-student DOCX' || true
          git push origin generated-output --force
